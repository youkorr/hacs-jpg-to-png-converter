convert:
  name: Convert Image
  description: Convert JPG/JPEG/WebP images to PNG format
  fields:
    local_input_path:
      description: Local path to input image file
      example: "/config/www/input.jpg"
      selector:
        text:
    url_input_path:
      description: URL to input image file
      example: "https://example.com/image.jpg"
      selector:
        text:
    output_path:
      description: Output path for converted PNG file
      example: "/config/www/output.png"
      required: true
      selector:
        text:
    resolution:
      description: Target resolution for the converted image
      example: "320x240"
      default: "320x240"
      selector:
        select:
          options:
            - "320x240"
            - "640x480"
            - "800x600"
            - "1280x720"
            - "1920x1080"
            - "original"
    custom_resolution:
      description: Custom resolution in format WIDTHxHEIGHT (overrides resolution field)
      example: "1024x768"
      selector:
        text:
    optimize_mode:
      description: Optimization mode for the converted image
      example: "none"
      default: "none"
      selector:
        select:
          options:
            - "none"
            - "esp32"
            - "standard"
    byte_order:
      description: "Byte order handling for ESPHome compatibility"
      example: "default"
      default: "default"
      selector:
        select:
          options:
            - "default"
            - "swap"
